
name: Prins Alexander cloud monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a Telegram test message only'
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: prins-alexander-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Check availability or test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && 'true' || 'false' }}
        run: python check.py
      - name: Save diagnostic screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 1
