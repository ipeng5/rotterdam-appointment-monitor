
name: Test Prins Alexander availability

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python check.py
      - name: Save diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-debug
          path: debug/
          retention-days: 1
